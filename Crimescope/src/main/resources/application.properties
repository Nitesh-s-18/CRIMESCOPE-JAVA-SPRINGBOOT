spring.application.name=CrimeScope
server.port=8501

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:data/crimescope.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite Connection Pool settings (prevent database locking)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# Thymeleaf Template Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/

# Data file paths
crimescope.csv-path=data/crime_data.csv
crimescope.db-path=data/crimescope.db
